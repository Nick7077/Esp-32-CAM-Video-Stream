; ESP32-S3-CAM  (ESP32-S3-WROOM-1 N16R8: 16 MB flash, 8 MB octal PSRAM) + OV3660
; Uses the pioarduino platform (Arduino-ESP32 core 3.x). The stock "espressif32"
; platform is stuck on core 2.x.

[env:esp32s3cam]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; --- N16R8 memory layout ---------------------------------------------------
board_build.arduino.memory_type = qio_opi   ; QIO flash + octal (OPI) PSRAM
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv   ; 2 x 6.5 MB app slots (OTA-ready) + FS

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1   ; `Serial` = the native USB-C port (fast, used for USB video)
    -DCORE_DEBUG_LEVEL=1          ; errors only, keeps the USB link clean

; --- Ports (Windows) --------------------------------------------------------
upload_port = COM4
monitor_port = COM4

; --- Serial monitor -------------------------------------------------------
; DTR/RTS off so opening the monitor doesn't reset the board.
; send_on_enter lets you type commands like `status` or `set framesize SVGA`.
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_echo = yes
monitor_filters = send_on_enter, esp32_exception_decoder
